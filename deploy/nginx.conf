# Place in an HTTPS-enabled server block with a trusted certificate.
# Replace network.example.com with the configured origin's host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name network.example.com;
    ssl_certificate /etc/letsencrypt/live/network.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/network.example.com/privkey.pem;
    client_max_body_size 2m;

    # Tokens appear in these paths. Do not write them to access logs.
    location ~ ^/(auth/hysteria|sub)/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
